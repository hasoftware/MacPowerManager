name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Swift version
        run: swift --version
      - name: Test
        run: swift test
      - name: Build universal app bundle
        run: UNIVERSAL=1 ./scripts/build-app.sh
      - name: Package
        run: ./scripts/package.sh
